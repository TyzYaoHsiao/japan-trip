<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8637c">
<title>🌸 日本佐賀自駕 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#e8637c;--light-pink:#fce8ed;--dark:#2a2a2a;--bg:#fff6f8;--gray:#888;--blue:#4285f4;--green:#34a853;--shadow:0 2px 16px rgba(232,99,124,.12);--radius:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;overflow-x:hidden}

.header{background:linear-gradient(135deg,#e8637c 0%,#f4929f 50%,#f8b4be 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 16px 12px;text-align:center;position:sticky;top:0;z-index:200;box-shadow:0 3px 20px rgba(232,99,124,.45)}
.header-title{font-size:19px;font-weight:700;letter-spacing:2px;text-shadow:0 1px 4px rgba(0,0,0,.15)}
.header-sub{font-size:11px;opacity:.9;margin-top:3px;letter-spacing:1px}

.tabs-wrapper{background:#fff;border-bottom:1.5px solid #f0dde2;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:var(--hh,74px);z-index:100}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 15px 9px;cursor:pointer;border-bottom:3px solid transparent;text-align:center;color:#aaa;transition:.25s;min-width:60px;background:none;border-top:0;border-left:0;border-right:0;font-family:inherit}
.tab.active{border-bottom-color:var(--pink);color:var(--pink)}
.tab-date{font-size:16px;font-weight:700;display:block}
.tab-label{font-size:10px;display:block;margin-top:1px}

.content{padding:14px 14px 60px;max-width:580px;margin:0 auto;position:relative;z-index:2}
#plan{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.day-hero{background:linear-gradient(135deg,var(--light-pink) 0%,#fff 70%);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;border:1.5px solid #f7d5dc}
.day-hero-top{display:flex;align-items:center;gap:10px}
.day-emoji{font-size:26px}
.day-hero h2{font-size:17px;font-weight:700;color:var(--pink)}
.day-hero p{font-size:12px;color:var(--gray);margin-top:2px}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:11px;top:6px;bottom:10px;width:2px;background:linear-gradient(to bottom,var(--pink),#f7d5dc,#f0f0f0);border-radius:2px}
.event{position:relative;margin-bottom:10px}
.event-dot{position:absolute;left:-19px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--pink);border:2.5px solid #fff;box-shadow:0 0 0 2px var(--pink);z-index:1}
.event.stay .event-dot{background:#7c5cbf;box-shadow:0 0 0 2px #7c5cbf}
.event.meal .event-dot{background:#f5a623;box-shadow:0 0 0 2px #f5a623}
.event.transit .event-dot{width:7px;height:7px;left:-16px;top:11px;background:#ddd;box-shadow:0 0 0 1.5px #ddd}
.event-card{background:#fff;border-radius:12px;padding:11px 13px;box-shadow:var(--shadow);border:1px solid #fde8ed}
.event.transit .event-card{background:#fafafa;box-shadow:none;border-color:#efefef;padding:7px 11px}
.event-time{font-size:13px;color:var(--pink);font-weight:700;margin-bottom:3px}
.event-name{white-space:pre-line;font-size:15px;font-weight:600;line-height:1.4}
.event-name a{color:inherit;text-decoration:underline;text-decoration-color:#f4a0b0;text-underline-offset:3px}
.event.transit .event-name{font-size:12px;color:#bbb;font-weight:400}
.event-note{font-size:12.5px;color:var(--gray);margin-top:5px;line-height:1.55;background:#fafafa;border-radius:8px;padding:5px 8px;border-left:2px solid var(--light-pink);white-space:pre-line}
.event-note.park{border-left-color:#4285f4}

.map-btn{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:9px 16px;background:linear-gradient(135deg,#4285f4,#5b9cf6);color:#fff;border-radius:20px;font-size:13px;font-weight:600;text-decoration:none;transition:transform .12s;box-shadow:0 2px 8px rgba(66,133,244,.3)}
.map-btn:active{transform:scale(.94)}
.map-btn svg{width:14px;height:14px;fill:#fff}

/* 住宿 / 租車 */
.info-card{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid #fde8ed}
.info-date{display:inline-block;background:var(--light-pink);color:var(--pink);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
.info-title{font-size:16px;font-weight:700;margin-top:8px}
.info-row{display:flex;gap:8px;font-size:13px;margin-top:6px;line-height:1.5}
.info-row b{flex:0 0 3em;color:var(--gray);font-weight:500}
.info-note{font-size:11px;color:var(--gray);margin-top:6px;line-height:1.55}
.resv{font-size:26px;font-weight:700;color:var(--pink);letter-spacing:2px;margin-top:6px;word-break:break-all}
.link{color:var(--blue);font-size:12px;text-decoration:none;margin-left:2px}

.petal-container{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.petal{position:absolute;top:-20px;font-size:12px;opacity:0;animation:petalFall linear infinite}
@keyframes petalFall{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:.6}90%{opacity:.3}100%{opacity:0;transform:translateY(100vh) rotate(720deg) translateX(30px)}}

.tab.today .tab-label{color:var(--pink);font-weight:700}
.tab.today .tab-label::after{content:" · 今天"}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{border-radius:20px;padding:4px 11px;font-size:12px;font-weight:500;background:#ede7f6;color:#7c5cbf}
.tag.car{background:#e8f0fe;color:#4285f4}
.event.stay .event-card{background:linear-gradient(135deg,#f3eefc,#fff);border-color:#d9ccf2}
.event.car .event-card{background:linear-gradient(135deg,#e8f0fe,#fff);border-color:#bcd2fa}
.event.car .event-dot{background:#4285f4;box-shadow:0 0 0 2px #4285f4}
.kv{display:flex;gap:8px;font-size:13px;margin-top:5px;line-height:1.5}
.kv b{flex:0 0 4.6em;color:var(--gray);font-weight:500}
.kv a{color:var(--blue);text-decoration:none}
.resv{font-size:22px;font-weight:700;color:#4285f4;letter-spacing:1.5px;word-break:break-all}
.overview{background:#fff;border-radius:var(--radius);border:1.5px solid #f7d5dc;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.overview summary{padding:13px 16px;font-weight:700;color:var(--pink);cursor:pointer;list-style:none;font-size:15px}
.overview summary::-webkit-details-marker{display:none}
.overview summary::after{content:"＋";float:right}
.overview[open] summary::after{content:"－"}
#ovbody{padding:0 14px 14px}
.info-card{background:#fff;border-radius:12px;padding:12px 14px;margin-top:10px;border:1px solid #fde8ed}
.info-card.carc{background:#f4f8ff;border-color:#d4e3fc}
.info-date{display:inline-block;background:var(--light-pink);color:var(--pink);border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:600}
.info-title{font-size:15px;font-weight:700;margin-top:6px}
.ov-h{font-size:12px;font-weight:700;color:var(--gray);letter-spacing:1px;margin:14px 0 -2px}

.header{padding-bottom:10px}
.seg{display:flex;gap:6px;margin:10px auto 0;max-width:420px;background:rgba(255,255,255,.25);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;border-radius:999px;background:none;color:#fff;font:600 13.5px 'Noto Sans TC',sans-serif;padding:8px 4px;cursor:pointer}
.seg button.on{background:#fff;color:var(--pink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.prog{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--pink);font-weight:600}
.bar{flex:1;height:8px;border-radius:99px;background:#f7d5dc;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8637c,#f4929f);border-radius:99px;transition:width .3s}
.wl-sec{margin-bottom:22px}
.wl-head{display:flex;align-items:center;gap:8px}
.wl-head h3{font-size:18px;color:var(--pink)}
.wl-hint{font-size:12px;color:var(--gray);margin:2px 0 8px}
.wl-group{background:#fff;border-radius:var(--radius);border:1px solid #fde8ed;box-shadow:var(--shadow);padding:6px 12px 10px;margin-bottom:10px}
.wl-gh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1.5px dashed #f7d5dc;font-weight:700;font-size:14.5px}
.wl-gh .map-btn{margin-top:0;padding:6px 12px;font-size:12px}
.wl-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #fbeef1;cursor:pointer}
.wl-item:last-child{border-bottom:0}
.wl-item input{position:absolute;opacity:0;pointer-events:none}
.wl-item .box{flex:0 0 24px;height:24px;border-radius:8px;border:2px solid var(--pink);background:#fff;display:grid;place-items:center;transition:.15s}
.wl-item input:checked+.box{background:var(--pink)}
.wl-item input:checked+.box::after{content:"✓";color:#fff;font-weight:700;font-size:15px}
.wl-item .fl{flex:0 0 auto;min-width:2.4em;text-align:center;background:var(--light-pink);color:var(--pink);border-radius:8px;padding:1px 6px;font-size:12px;font-weight:700}
.wl-item .nm{flex:1;font-size:15px;font-weight:600}
.wl-item .nm small{display:block;font-size:12px;color:var(--gray);font-weight:400}
.wl-item.done .nm{text-decoration:line-through;color:#bbb}
.wl-item .fav{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:20px;background:linear-gradient(135deg,#e8637c,#f4929f);color:#fff;font-size:12.5px;font-weight:600;text-decoration:none;box-shadow:0 2px 8px rgba(232,99,124,.35)}
.wl-item .fav:active{transform:scale(.95)}
.wl-item .mini{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e8f0fe;text-decoration:none;font-size:16px}
</style>
</head>

// 行程
const tabsEl = document.getElementById("tabs"), plan = document.getElementById("plan");
const dayIdx = () => { const n=new Date(); return Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(2026,9,11))/864e5); };
tabsEl.innerHTML = DAYS.map((x,i)=>`<button class="tab" data-i="${i}"><span class="tab-date">${esc(x.d.split(" ")[0])}</span><span class="tab-label">Day ${i+1}</span></button>`).join("");
let cur = 0;
function showDay(i){
  cur = i;
  [...tabsEl.children].forEach((b,j)=>{b.classList.toggle("active",i===j);b.classList.toggle("today",j===dayIdx())});
  const day = DAYS[i], night = NIGHT[i]==null?null:STAY[NIGHT[i]];
  const tags = (night?`<span class="tag">🏨 今晚住：${esc(night.area)}</span>`:"") + (i===0?`<span class="tag car">🚗 取車</span>`:"") + (i===7?`<span class="tag car">🚗 還車</span>`:"");
  plan.innerHTML = `<div class="day-hero"><div class="day-hero-top"><div class="day-emoji">${day.e}</div><div><h2>${esc(day.t)}</h2><p>${esc(day.d)}</p></div></div>${tags?`<div class="tags">${tags}</div>`:""}</div><div class="timeline">` +
  day.items.map(([t,n,info,q,link,park,type,sx,links])=>{
    if(type==="drive") return `<div class="event transit"><div class="event-dot"></div><div class="event-card"><div class="event-name">${esc(n)}</div></div></div>`;
    let extra="", mq=q;
    if(type==="stay"){ const st=STAY[sx]; if(st){ mq=st.map; extra=`<div class="event-note">🏨 ${esc(st.name)}</div>`; } }
    if(type==="car"){ extra=carBlock(sx); mq=gm(CAR.q); }
    const title = link?`<a href="${esc(link)}" target="_blank" rel="noopener">${esc(n)}</a>`:esc(n);
    return `<div class="event ${type||""}"><div class="event-dot"></div><div class="event-card">
      ${t?`<div class="event-time">${esc(t)}</div>`:""}
      <div class="event-name">${type==="meal"?"🍙 ":type==="stay"?"🏨 ":type==="car"?"🚗 ":""}${title}</div>
      ${extra}
      ${info?`<div class="event-note">${esc(info)}</div>`:""}
      ${park?`<div class="event-note park">🅿️ ${esc(park)}</div>`:""}
      ${(links||[]).map(([l,u])=>`<div class="event-note"><a href="${esc(u)}" target="_blank" rel="noopener">🔗 ${esc(l)}</a></div>`).join("")}
      ${mq?mapBtn(mapUrl(mq)):""}</div></div>`;
  }).join("") + `</div>`;
  tabsEl.children[i].scrollIntoView({inline:"center",block:"nearest"});
  window.scrollTo({top:0});
  try{localStorage.setItem("day",i)}catch(e){}
}
tabsEl.onclick = e=>{const b=e.target.closest("button");if(b)showDay(+b.dataset.i)};

  p.style.left=Math.random()*100+"%";p.style.animationDuration=(7+Math.random()*7)+"s";p.style.animationDelay=(Math.random()*8)+"s";pc.appendChild(p)}

const pick = () => { const x=dayIdx(); if(x>=0&&x<DAYS.length) return x; try{return +localStorage.getItem("day")||0}catch(e){return 0} };
showDay(pick());
// 從背景切回來（例如隔天重新打開）時，如果日期變了就自動跳到當天
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ const x=dayIdx(); if(x>=0&&x<DAYS.length&&x!==cur)showDay(x) } });
</script>
</body>
